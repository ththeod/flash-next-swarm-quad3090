<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="flash-next-swarm-quad3090: Swift 1.5 on 4x RTX 3090. Generation 1,144 tok/s at 16 requests; prefill 8,490 tok/s on a 50K prompt; 1.21M-token KV cache plus a RAM tier; 26.6 turns per minute with 40 agents.">
