<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Charts start hidden only when charts.js is going to animate them; if it never runs, show them after 3 s.
    document.documentElement.classList.add('js');
    setTimeout(function () { if (!window.chartsReady) document.documentElement.classList.remove('js'); }, 3000);
  </script>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <a class="gh" href="{{ site.repo }}">GitHub ↗</a>
    </div>
  </header>

  <main class="post">
{{ content }}
  </main>

  <footer class="site-footer">
    <div class="bar">
      <span>Built on halt95's <a href="https://github.com/halt95/merlin-engine">Flash-Next engine</a> · code under Apache-2.0</span>
      <a href="{{ site.repo }}">{{ site.title }}</a>
    </div>
  </footer>
  <script src="{{ '/assets/js/charts.js' | relative_url }}" defer></script>
</body>
</html>
